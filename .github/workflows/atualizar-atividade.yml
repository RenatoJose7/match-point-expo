name: Atualizar atividade da equipe

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gerar-painel:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar painel de atividade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/atualizar-atividade.mjs

      - name: Exibir relatório na execução
        shell: bash
        run: |
          cat docs/ATIVIDADE_EQUIPE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar relatório por 14 dias
        uses: actions/upload-artifact@v4
        with:
          name: atividade-equipe
          path: docs/ATIVIDADE_EQUIPE.md
          retention-days: 14
